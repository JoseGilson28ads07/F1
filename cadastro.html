<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro | Pit Lane F1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="pagina-form">
    <form class="form" action="#" onsubmit="return false">
      <p class="logo">PIT LANE <span>F1</span></p>
      <h1>Criar conta</h1>
      <p class="aviso">Demonstração de interface: nenhum dado é enviado ou salvo.</p>
      <label for="nome">Nome</label>
      <input type="text" id="nome" required>
      <label for="email">E-mail</label>
      <input type="email" id="email" required>
      <label for="senha">Senha</label>
      <input type="password" id="senha" required>
      <label for="senha2">Confirmar senha</label>
      <input type="password" id="senha2" required>
      <button class="btn" type="submit">Cadastrar</button>
      <p class="links">Já tem conta? <a href="login.html">Entrar</a><br><a href="index.html">← Voltar ao site</a></p>
    </form>
  </main>
</body>
</html>
